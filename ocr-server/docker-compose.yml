services:
  ocr:
    build:
      # Context là thư mục gốc repo để copy được cả woodblock modules.
      context: ..
      dockerfile: ocr-server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ocr_user
      DB_PASSWORD: ocr_password
      DB_NAME: ocr
    depends_on:
      - postgres
    volumes:
      # Cache model ra ngoài để khỏi tải lại mỗi lần rebuild
      - paddle_models:/root/.paddlex
      # Gắn folder model finetuned từ host vào container dưới dạng chỉ đọc
      - ./ppocrv6_medium_finetuned_precision:/code/ppocrv6_medium_finetuned_precision:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ocr_user
      POSTGRES_PASSWORD: ocr_password
      POSTGRES_DB: ocr
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  paddle_models:
  postgres_data:
